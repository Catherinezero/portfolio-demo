<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:-apple-system, BlinkMacSystemFont, sans-serif;
        }
        body{
            background:#f6f7f9;
            padding:40px 20px;
        }
        .container{
            width:min(90%,760px);
            margin:0 auto;
            padding:70px 60px;
            background:#ffffff;
            border:1px solid #eaeaea;
            border-radius:20px;
            box-shadow:0 15px 50px rgba(0,0,0,0.05);
        }
        .tag{
            font-size:14px;
            color:#777;
            letter-spacing:1px;
            margin-bottom:24px;
        }
        h1{
            font-size:64px;
            font-weight:600;
            color:#222;
            margin-bottom:24px;
        }
        p{
            font-size:18px;
            color:#555;
            line-height:1.7;
            margin-bottom:48px;
        }
        .skill-title{
            font-size:14px;
            color:#777;
            letter-spacing:1px;
            margin-bottom:16px;
        }
        .skills{
            display:flex;
            gap:14px;
        }
        .skill-item{
            border:1px solid #ccc;
            padding:10px 22px;
            border-radius:12px;
            font-size:16px;
        }
        footer{
            margin-top:60px;
            font-size:14px;
            color:#999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tag">PERSONAL PORTFOLIO</div>
        <h1>Your Name</h1>
        <p>Hello, I am a student learning web development. I build clean static websites with HTML and CSS. I use AI to assist coding and keep improving my frontend skills.</p >
        <div class="skill-title">SKILLS</div>
        <div class="skills">
            <div class="skill-item">HTML</div>
            <div class="skill-item">CSS</div>
        </div>
        <footer>© 2026 Your Name</footer>
    </div>
</body>
</html>
